spring.application.name=estudio-bdd-api

# Banco local (docker-compose.yml na raiz). Pode ser sobrescrito por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estudiobdd}
spring.datasource.username=${DB_USER:estudio}
spring.datasource.password=${DB_PASSWORD:estudio}

# update cria/ajusta as tabelas e mantém os dados entre reinicializações
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

server.port=8080

# carrega coleções LAZY em lote (evita uma consulta por cenário ao buscar os passos)
spring.jpa.properties.hibernate.default_batch_fetch_size=20
